name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libgtk-3-dev

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . --parallel 4

    - name: Check Product
      run: |
        cd build
        ls -l
        file raven

    - name: Package Product
      run: |
        cd build
        chmod +x raven
        zip -r raven-linux.zip raven

    - name: Archive Product
      uses: actions/upload-artifact@v5
      with:
        name: raven-linux.zip
        path: build/raven-linux.zip

  MacOS:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build . --parallel 4

    - name: Check Product
      run: |
        cd build
        ls -l
        file raven

    - name: Package Product
      run: |
        cd build
        chmod +x raven
        zip -r raven-mac.zip raven

    - name: Archive Product
      uses: actions/upload-artifact@v5
      with:
        name: raven-mac.zip
        path: build/raven-mac.zip

  Emscripten:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install Dependencies
      run: |
        wget -q https://github.com/emscripten-core/emsdk/archive/master.tar.gz
        tar -xvf master.tar.gz
        emsdk-master/emsdk update
        emsdk-master/emsdk install latest
        emsdk-master/emsdk activate latest

    - name: Pre-build zlib port
      run: |
        source emsdk-master/emsdk_env.sh
        embuilder build zlib

    - name: Build
      run: |
        source emsdk-master/emsdk_env.sh
        mkdir build-web
        cd build-web
        emcmake cmake .. \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-sUSE_ZLIB=1"
        cmake --build . --parallel 4

    - name: Check Product
      run: |
        ls -l build-web

    - name: Package Product
      run: |
        cd build-web
        zip -r raven-web.zip raven.html raven.wasm raven.js raven.worker.js

    - name: Archive Product
      uses: actions/upload-artifact@v5
      with:
        name: raven-web.zip
        path: build-web/raven-web.zip
  Windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Install ZLIB
      run: |
        vcpkg install zlib:x64-windows
        echo "CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows" >> $env:GITHUB_ENV

    - name: Build
      run: |
        mkdir build_win64
        cd build_win64
        cmake ..
        cmake --build . --config Debug --parallel 4
        cmake --build . --config Release --parallel 4

    # vcpkg's zlib port renames the Windows DLL to z.dll (not zlib1.dll).
    # raven.exe links against it, so bundle it into the archive next to
    # raven.exe so users who download the artifact can actually run it.
    - name: Bundle ZLIB DLL for archive
      shell: pwsh
      run: |
        Copy-Item "C:/vcpkg/installed/x64-windows/bin/*.dll" "build_win64/Debug/"
        Copy-Item "C:/vcpkg/installed/x64-windows/bin/*.dll" "build_win64/Release/"

    - name: Check Product
      shell: bash
      run: |
        cd build_win64
        pwd
        ls -l
        ls -l ./Debug/
        ls -l ./Release/
        file ./Debug/raven.exe
        file ./Release/raven.exe

    - name: Archive Product
      uses: actions/upload-artifact@v5
      with:
        name: raven-windows-x64.zip
        path: |
          build_win64/Release/*
          build_win64/Debug/*
  package_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.9"]
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-2022, macos-14, macos-latest ]
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
        submodules: recursive
    - name: Install Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libgtk-3-dev
      if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
    - name: Install ZLIB (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        vcpkg install zlib:x64-windows
        echo "CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows" >> $env:GITHUB_ENV
    - name: Install UV
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.8.22"
        python-version: ${{ matrix.python-version }}
    - name: Install Python
      run: uv python install
    - name: Build Python wheel
      run: |
        uv build --wheel
    - name: Archive Python wheel
      uses: actions/upload-artifact@v5
      with:
        name: wheel-${{ matrix.os }}
        path: dist/*.whl
  package_sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgtk-3-dev
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
      - name: Install Python
        run: uv python install
      - name: Build Python wheel
        run: |
          uv build --sdist
      - name: Archive Python sdist
        uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
